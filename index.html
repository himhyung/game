<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>cat card</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="top">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <span class="brand-name">cat card</span>
    </div>

    <div class="top-right">
      <span class="status" id="statusText">지갑 미연결</span>
      <button class="btn connect" id="connectBtn" type="button">
        Connect MetaMask
      </button>
    </div>
  </header>

  <main class="hero">
    <div class="hero-inner">
      <div class="chip">♡ pink & cute</div>

      <h1 class="title">Cat Card</h1>
      <p class="subtitle">
        메타마스크를 연결하고 버튼을 눌러 Cat Card Draw를 실행해봐!
      </p>

      <button class="btn draw" id="drawBtn" type="button">
        Cat Card Draw
      </button>

      <div class="panel">
        <div class="panel-row">
          <div class="label">Wallet</div>
          <div class="value" id="walletText">—</div>
        </div>
        <div class="panel-row">
          <div class="label">Result</div>
          <div class="value" id="resultText">버튼을 눌러 카드를 뽑아봐 🐾</div>
        </div>
      </div>

      <p class="note">
        * 메타마스크가 설치되어 있어야 연결돼. (모바일은 MetaMask 앱 내 브라우저에서 열면 쉬워)
      </p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
